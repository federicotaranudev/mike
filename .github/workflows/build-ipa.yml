name: Build Mike IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xtool 1.17.0
        run: |
          curl -fL -o xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip
          ditto -x -k xtool.app.zip .
          echo "$PWD/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          "$PWD/xtool.app/Contents/Resources/bin/xtool" --version

      - name: Build unsigned IPA
        working-directory: ios
        run: xtool dev build --ipa -c release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mike-ipa
          path: ios/xtool/*.ipa
          retention-days: 7

      - name: Rename IPA
        run: mv ios/xtool/*.ipa ios/xtool/Mike-iPhone.ipa

      - name: Publish release with the IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Mike iPhone v0.3.0 - tool calling, fixed Approvals/Activity, model download
          files: ios/xtool/Mike-iPhone.ipa
