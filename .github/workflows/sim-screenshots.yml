name: sim-screenshots
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile app for the iOS simulator (6 variants)
        run: |
          set -euo pipefail
          cd ios/Sources/Mike
          build_variant() {
            local NAME="$1"; shift
            xcrun -sdk iphonesimulator swiftc -parse-as-library \
              -target arm64-apple-ios17.0-simulator \
              -module-name MikeSim "$@" \
              *.swift -o "/tmp/MikeSim_$NAME"
            echo "built $NAME"
          }
          build_variant CHAT -D SIM_FORCE_GROQ
          build_variant APPROVALS -D SIM_TAB_APPROVALS -D SIM_FORCE_GROQ
          build_variant ACTIVITY -D SIM_TAB_ACTIVITY -D SIM_FORCE_GROQ
          build_variant SETTINGS -D SIM_TAB_SETTINGS -D SIM_FORCE_LOCAL
          build_variant ONBOARDING -D SIM_ONBOARDING
          build_variant LOCALCHAT -D SIM_FORCE_LOCAL
      - name: Bundle and screenshot each variant
        run: |
          set -euo pipefail
          mkdir -p shots
          # pick an available iPhone simulator
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      print(dev['udid']); sys.exit(0)
          sys.exit('no iPhone sim')")
          echo "device $DEV"
          xcrun simctl boot "$DEV" || true
          for TAB in CHAT APPROVALS ACTIVITY SETTINGS ONBOARDING LOCALCHAT; do
            APP="/tmp/MikeSim_$TAB.app"
            mkdir -p "$APP"
            cp "/tmp/MikeSim_$TAB" "$APP/MikeSim"
            python3 - "$APP/Info.plist" <<'PLIST'
          import plistlib, sys
          plistlib.dump({
            "CFBundleExecutable": "MikeSim",
            "CFBundleIdentifier": "dev.federicotaranu.mike",
            "CFBundleName": "Mike",
            "CFBundleDisplayName": "Mike",
            "CFBundlePackageType": "APPL",
            "CFBundleShortVersionString": "0.2",
            "CFBundleVersion": "1",
            "MinimumOSVersion": "17.0",
            "UIDeviceFamily": [1],
            "CFBundleSupportedPlatforms": ["iPhoneSimulator"],
            "UILaunchScreen": {},
          }, open(sys.argv[1], "wb"))
          PLIST
            codesign -s - --timestamp=none "$APP" || true
            xcrun simctl uninstall booted dev.federicotaranu.mike || true
            xcrun simctl install booted "$APP"
            xcrun simctl launch booted dev.federicotaranu.mike
            sleep 8
            xcrun simctl io booted screenshot "shots/$TAB.png"
            xcrun simctl terminate booted dev.federicotaranu.mike || true
            echo "shot $TAB"
          done
          ls -la shots/
      - uses: actions/upload-artifact@v4
        with:
          name: mike-sim-screenshots
          path: shots/
          retention-days: 30

      - name: Publish screenshots as release assets (evidence only)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create sim-evidence --title "Simulator screenshots (UI evidence)" --notes "Automated simulator captures for review - not a Mike release. Safe to delete." --latest=false || true
          gh release upload sim-evidence shots/CHAT.png shots/APPROVALS.png shots/ACTIVITY.png shots/SETTINGS.png shots/ONBOARDING.png shots/LOCALCHAT.png --clobber
