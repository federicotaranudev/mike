name: runtime-smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model artifact: gpu (2.0GB, GPU-only) or base (2.59GB, may support CPU)"
        required: true
        default: "gpu"
        type: choice
        options: [gpu, base]

# REAL LiteRT-LM runtime validation on the CI simulator (arm64 slice exists in
# CLiteRTLM.xcframework v0.18.1). Loads the actual 2.0 GB model, runs one
# generation, prints SMOKE_RESULT. GPU backend first, CPU retry on failure.
# Zero cost: public model, public release asset, free runner.
jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LiteRT-LM Swift wrapper sources (v0.18.1)
        run: |
          set -euo pipefail
          mkdir -p /tmp/litertlm
          curl -fsSL "https://github.com/google-ai-edge/LiteRT-LM/archive/refs/tags/v0.18.1.tar.gz" | tar -xz -C /tmp/litertlm --strip-components=1
          ls /tmp/litertlm/swift
      - name: Download CLiteRTLM.xcframework
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcf.zip "https://github.com/google-ai-edge/LiteRT-LM/releases/download/v0.18.1/CLiteRTLM.xcframework.zip"
          unzip -q -o /tmp/xcf.zip -d /tmp/xcf
          ls /tmp/xcf/CLiteRTLM.xcframework
      - name: Compile LiteRTLM Swift module from wrapper sources
        run: |
          set -euo pipefail
          FW=/tmp/xcf/CLiteRTLM.xcframework/ios-arm64-simulator/CLiteRTLM.framework
          cd /tmp/litertlm/swift
          xcrun -sdk iphonesimulator swiftc -parse-as-library \
            -target arm64-apple-ios17.0-simulator \
            -module-name LiteRTLM \
            -emit-library -emit-module \
            -emit-module-path /tmp/litertlm/LiteRTLM.swiftmodule \
            -Xcc -fmodule-map-file="$FW/Modules/module.modulemap" \
            -F /tmp/xcf/CLiteRTLM.xcframework/ios-arm64-simulator -framework CLiteRTLM \
            $(ls *.swift | grep -v Tests) \
            -o /tmp/litertlm/libLiteRTLM.dylib
          echo wrapper-built
      - name: Compile Mike smoke variant for the iOS simulator
        run: |
          set -euo pipefail
          FW=/tmp/xcf/CLiteRTLM.xcframework/ios-arm64-simulator/CLiteRTLM.framework
          cd ios/Sources/Mike
          xcrun -sdk iphonesimulator swiftc -parse-as-library \
            -target arm64-apple-ios17.0-simulator \
            -module-name MikeSim \
            -I /tmp/litertlm \
            -Xcc -fmodule-map-file="$FW/Modules/module.modulemap" \
            -F /tmp/xcf/CLiteRTLM.xcframework/ios-arm64-simulator -framework CLiteRTLM \
            -L /tmp/litertlm -lLiteRTLM \
            *.swift -o /tmp/MikeSim_SMOKE \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks
          echo app-built
      - name: Bundle, install, stage model
        run: |
          set -euo pipefail
          FW=/tmp/xcf/CLiteRTLM.xcframework/ios-arm64-simulator/CLiteRTLM.framework
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      print(dev['udid']); sys.exit(0)
          sys.exit('no iPhone sim')")
          echo "device $DEV"
          xcrun simctl boot "$DEV" || true
          APP=/tmp/MikeSim_SMOKE.app
          mkdir -p "$APP/Frameworks"
          cp /tmp/MikeSim_SMOKE "$APP/MikeSim"
          cp -R "$FW" "$APP/Frameworks/"
          cp /tmp/litertlm/libLiteRTLM.dylib "$APP/Frameworks/"
          python3 - "$APP/Info.plist" <<'PLIST'
          import plistlib, sys
          plistlib.dump({
            "CFBundleExecutable": "MikeSim",
            "CFBundleIdentifier": "dev.federicotaranu.mike",
            "CFBundleName": "Mike",
            "CFBundleDisplayName": "Mike",
            "CFBundlePackageType": "APPL",
            "CFBundleShortVersionString": "0.4",
            "CFBundleVersion": "1",
            "MinimumOSVersion": "17.0",
            "UIDeviceFamily": [1],
            "CFBundleSupportedPlatforms": ["iPhoneSimulator"],
            "UILaunchScreen": {},
          }, open(sys.argv[1], "wb"))
          PLIST
          codesign -s - --timestamp=none --force "$APP/Frameworks/CLiteRTLM.framework" || true
          codesign -s - --timestamp=none --force "$APP/Frameworks/libLiteRTLM.dylib" || true
          codesign -s - --timestamp=none --force "$APP" || true
          xcrun simctl uninstall booted dev.federicotaranu.mike || true
          xcrun simctl install booted "$APP"
          if [ "${{ inputs.model }}" = "base" ]; then
            FILE="gemma-4-E2B-it.litertlm"
          else
            FILE="gemma-4-E2B-it-gpu.litertlm"
          fi
          echo "downloading $FILE ..."
          curl -fsSL -o /tmp/model.litertlm "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/$FILE"
          ls -l /tmp/model.litertlm
          # Integrity: SHA-256 against the publisher's LFS hash, fetched live
          # from the HF paths-info API for the chosen artifact.
          EXPECT=$(curl -fsSL -X POST "https://huggingface.co/api/models/litert-community/gemma-4-E2B-it-litert-lm/paths-info/main" -H "Content-Type: application/json" -d "{\"paths\":[\"$FILE\"]}" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['lfs']['oid'])")
          echo "expected sha256: $EXPECT"
          echo "$EXPECT  /tmp/model.litertlm" | shasum -a 256 -c -
          CONT=$(xcrun simctl get_app_container booted dev.federicotaranu.mike data)
          mkdir -p "$CONT/Documents"
          cp /tmp/model.litertlm "$CONT/Documents/model.litertlm"
          echo "CONT=$CONT" >> "$GITHUB_ENV"
      - name: Smoke run - GPU backend
        run: |
          set -euo pipefail
          # Sample the app's resident memory every 5s while it runs: real data
          # for the iPhone 13 (4GB) feasibility question.
          ( for i in $(seq 1 150); do
              ps -axo rss=,comm= | awk '/MikeSim$/ {print $1}' >> /tmp/rss-gpu.log
              sleep 5
            done ) &
          SAMPLER=$!
          set +e
          xcrun simctl launch --console booted dev.federicotaranu.mike -RuntimeSmoke "$CONT/Documents/model.litertlm" 2>&1 | grep --line-buffered -E "SMOKE_|error|Error|fatal" | tee /tmp/smoke-gpu.log
          set -e
          kill $SAMPLER 2>/dev/null || true
          PEAK=$(sort -n /tmp/rss-gpu.log 2>/dev/null | tail -1)
          { echo "### Runtime smoke - GPU"; echo '```'; grep -E "SMOKE_(START|RESULT)" /tmp/smoke-gpu.log || echo "no smoke output captured"; echo "PEAK_RSS_MB=$(( ${PEAK:-0} / 1024 ))"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "SMOKE_RESULT" /tmp/smoke-gpu.log; then
            # No result line at all means the process died before flushing
            # (e.g. memory kill) - pull the sim unified log for evidence.
            { echo "### GPU attempt - sim log tail (possible kill)"; echo '```'; xcrun simctl spawn booted log show --last 6m --style compact --predicate 'process == "MikeSim"' 2>/dev/null | grep -iE "smoke|memory|jetsam|kill|crash" | tail -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Smoke run - CPU backend (only if GPU failed)
        run: |
          set -euo pipefail
          if grep -q "SMOKE_RESULT OK" /tmp/smoke-gpu.log; then
            echo "GPU smoke passed, CPU retry not needed"
            exit 0
          fi
          ( for i in $(seq 1 150); do
              ps -axo rss=,comm= | awk '/MikeSim$/ {print $1}' >> /tmp/rss-cpu.log
              sleep 5
            done ) &
          SAMPLER=$!
          set +e
          xcrun simctl launch --console booted dev.federicotaranu.mike -RuntimeSmoke "$CONT/Documents/model.litertlm" cpu 2>&1 | grep --line-buffered -E "SMOKE_|error|Error|fatal" | tee /tmp/smoke-cpu.log
          set -e
          kill $SAMPLER 2>/dev/null || true
          PEAKC=$(sort -n /tmp/rss-cpu.log 2>/dev/null | tail -1)
          { echo "### Runtime smoke - CPU retry"; echo '```'; grep -E "SMOKE_(START|RESULT)" /tmp/smoke-cpu.log || echo "no smoke output captured"; echo "PEAK_RSS_MB=$(( ${PEAKC:-0} / 1024 ))"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict
        run: |
          set -euo pipefail
          if grep -q "SMOKE_RESULT OK" /tmp/smoke-gpu.log 2>/dev/null; then
            V="RUNTIME-SMOKE: GPU OK"
          elif grep -q "SMOKE_RESULT OK" /tmp/smoke-cpu.log 2>/dev/null; then
            V="RUNTIME-SMOKE: CPU OK (GPU failed)"
          else
            V="RUNTIME-SMOKE: NO WORKING BACKEND ON SIMULATOR"
            echo "$V" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$V" | tee -a "$GITHUB_STEP_SUMMARY"
