appId: dev.federicotaranu.mike
---
# Proactive layer acceptance: after -NotifSmoke scheduled a reminder and the
# app was killed, a plain relaunch must make Mike speak first about the pending
# reminder. A SECOND relaunch with unchanged signals must stay silent (durable
# dedup - no check-in spam). -SeedLocalProvider (CI-only hook) gets past the
# onboarding gate on a fresh simulator, like a user who finished setup.
- launchApp:
    appId: dev.federicotaranu.mike
    arguments:
      SeedLocalProvider: "1"
# Maestro text selectors full-match the element's text as a regex, so the
# greeting's dynamic suffix ("... 1 reminder set, next at 00:33.") needs .*.
- extendedWaitUntil:
    visible:
      text: "Welcome back.*"
    timeout: 20000
- takeScreenshot: proactive-checkin
- killApp
- launchApp:
    appId: dev.federicotaranu.mike
    arguments:
      SeedLocalProvider: "1"
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      text: "Welcome back.*"
    timeout: 10000
# Leave the app dead: the reminder must fire (and be delivered) with Mike not
# running, which is the case the delivery check exists for.
- killApp
