appId: dev.federicotaranu.mike
---
# Proactive layer acceptance: after -NotifSmoke scheduled a reminder and the
# app was killed, a plain relaunch must make Mike speak first about the pending
# reminder in an untouched chat. Proves the foreground check-in path.
- launchApp
- assertVisible:
    text: "Welcome back"
    timeout: 20000
- takeScreenshot: proactive-checkin
