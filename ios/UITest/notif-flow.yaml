appId: dev.federicotaranu.mike
---
# Notification execution acceptance, part 1: launch with -NotifSmoke (schedules
# a real reminder through the approved-reminder code path), granting the
# notification permission deterministically. The app NSLog()s NOTIF_PENDING
# after ~8s; we wait, then kill it so the reminder fires with the app dead.
- launchApp:
    appId: dev.federicotaranu.mike
    arguments:
      NotifSmoke: "1"
    permissions:
      notifications: allow
- tapOn:
    text: "Allow"
    optional: true
# The system permission dialog can appear a beat after launch; if the first
# optional tap missed it, wait for it to show up and tap again. Optional so a
# pre-granted permission (no dialog at all) does not fail the flow.
- extendedWaitUntil:
    visible:
      text: "Allow"
    timeout: 12000
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- killApp
