appId: dev.federicotaranu.mike
---
# Notification execution acceptance: launch with -NotifSmoke (schedules a real
# reminder through the approved-reminder code path), granting notification
# permission deterministically. The app prints NOTIF_PENDING and exits; the
# workflow then waits for delivery and relaunches with -NotifCheck.
- launchApp:
    appId: dev.federicotaranu.mike
    arguments: "-NotifSmoke"
    permissions:
      notifications: allow
