name: Build Mike IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xtool 1.17.0
        run: |
          curl -L -o xtool.app.zip https://github.com/xtool-org/xtool/releases/download/1.17.0/xtool.app.zip
          ditto -x -k xtool.app.zip xtool.app
          echo "$PWD/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build unsigned IPA
        working-directory: ios
        run: xtool dev build --ipa -c release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mike-ipa
          path: ios/xtool/*.ipa
          retention-days: 7
